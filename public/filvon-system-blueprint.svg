<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <linearGradient id="accent" x1="120" y1="100" x2="1060" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA8FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientTransform="translate(660 360) rotate(90) scale(310 430)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <filter id="nodeGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#2C62C5" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#glow)"/>
  <rect x="58" y="52" width="1084" height="650" fill="url(#grid)" opacity=".8"/>

  <!-- blueprint corners -->
  <g stroke="#2F6DE0" stroke-opacity=".36">
    <path d="M80 112H220M80 112V240"/>
    <path d="M1120 112H980M1120 112V240"/>
    <path d="M80 650H220M80 650V522"/>
    <path d="M1120 650H980M1120 650V522"/>
  </g>

  <!-- top title -->
  <g fill="#77A8FF" font-family="Inter,Arial,sans-serif">
    <text x="86" y="90" font-size="14" letter-spacing="3.2">FILVON DIGITAL SYSTEM MAP</text>
    <text x="964" y="90" font-size="12" letter-spacing="2.4">SYS-01 / IMPACT FLOW</text>
  </g>

  <!-- main flow line -->
  <path d="M165 390H1032" stroke="#316FD9" stroke-opacity=".5" stroke-width="1.5"/>
  <path d="M165 390H1032" stroke="url(#accent)" stroke-opacity=".9" stroke-width="2" stroke-dasharray="10 12"/>

  <!-- WEB MODULE -->
  <g transform="translate(110 220)">
    <rect x="0" y="0" width="250" height="250" rx="28" stroke="#356FD6" stroke-opacity=".6"/>
    <rect x="18" y="18" width="214" height="214" rx="20" stroke="#356FD6" stroke-opacity=".28"/>
    <path d="M42 62H208" stroke="#5E93FF" stroke-opacity=".75"/>
    <circle cx="54" cy="46" r="4" fill="#6EA8FF"/>
    <circle cx="70" cy="46" r="4" fill="#356FD6"/>
    <circle cx="86" cy="46" r="4" fill="#356FD6"/>
    <rect x="42" y="84" width="74" height="52" rx="10" stroke="#4B86FF" stroke-opacity=".75"/>
    <rect x="128" y="84" width="80" height="20" rx="8" stroke="#4B86FF" stroke-opacity=".5"/>
    <rect x="128" y="116" width="80" height="20" rx="8" stroke="#4B86FF" stroke-opacity=".35"/>
    <rect x="42" y="156" width="166" height="48" rx="10" stroke="#4B86FF" stroke-opacity=".42"/>
    <text x="28" y="278" fill="#7EAAFF" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2.5">01 / WEB</text>
    <text x="28" y="301" fill="#5476A9" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.7">EXPERIENCE / INTERFACE / TRUST</text>
  </g>

  <!-- AI MODULE -->
  <g transform="translate(450 205)">
    <circle cx="140" cy="140" r="128" stroke="#356FD6" stroke-opacity=".5"/>
    <circle cx="140" cy="140" r="92" stroke="#356FD6" stroke-opacity=".24"/>
    <circle cx="140" cy="140" r="48" stroke="#4B86FF" stroke-opacity=".6"/>
    <g stroke="#4B86FF" stroke-opacity=".75">
      <path d="M140 92L92 124L110 178L170 186L194 132L140 92Z"/>
      <path d="M92 124L62 86"/>
      <path d="M194 132L228 96"/>
      <path d="M110 178L78 220"/>
      <path d="M170 186L208 224"/>
    </g>
    <g fill="#6EA8FF" filter="url(#nodeGlow)">
      <circle cx="140" cy="92" r="5"/>
      <circle cx="92" cy="124" r="5"/>
      <circle cx="110" cy="178" r="5"/>
      <circle cx="170" cy="186" r="5"/>
      <circle cx="194" cy="132" r="5"/>
      <circle cx="62" cy="86" r="4"/>
      <circle cx="228" cy="96" r="4"/>
      <circle cx="78" cy="220" r="4"/>
      <circle cx="208" cy="224" r="4"/>
    </g>
    <text x="58" y="310" fill="#7EAAFF" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2.5">02 / AI</text>
    <text x="58" y="333" fill="#5476A9" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.7">DATA / INSIGHT / DECISION</text>
  </g>

  <!-- AUTOMATION MODULE -->
  <g transform="translate(770 220)">
    <rect x="0" y="0" width="250" height="250" rx="28" stroke="#356FD6" stroke-opacity=".6"/>
    <rect x="20" y="20" width="210" height="210" rx="20" stroke="#356FD6" stroke-opacity=".28"/>
    <g stroke="#4B86FF" stroke-opacity=".72">
      <circle cx="56" cy="68" r="18"/>
      <circle cx="125" cy="125" r="18"/>
      <circle cx="194" cy="182" r="18"/>
      <path d="M74 68H102C114 68 125 79 125 91V107"/>
      <path d="M143 125H171C183 125 194 136 194 148V164"/>
    </g>
    <g fill="#6EA8FF" filter="url(#nodeGlow)">
      <circle cx="56" cy="68" r="4"/>
      <circle cx="125" cy="125" r="4"/>
      <circle cx="194" cy="182" r="4"/>
    </g>
    <path d="M86 68L98 62V74L86 68Z" fill="#6EA8FF"/>
    <path d="M155 125L167 119V131L155 125Z" fill="#6EA8FF"/>
    <text x="22" y="278" fill="#7EAAFF" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2.5">03 / AUTOMATION</text>
    <text x="22" y="301" fill="#5476A9" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.7">FLOW / CONNECTION / EFFICIENCY</text>
  </g>

  <!-- connectors -->
  <g stroke="#6EA8FF" stroke-opacity=".8" stroke-width="1.5">
    <path d="M360 345H450"/>
    <path d="M730 345H770"/>
  </g>
  <g fill="#6EA8FF" filter="url(#nodeGlow)">
    <circle cx="405" cy="345" r="4"/>
    <circle cx="750" cy="345" r="4"/>
  </g>

  <!-- impact node -->
  <g transform="translate(1010 300)">
    <circle cx="80" cy="80" r="70" stroke="#4B86FF" stroke-opacity=".55"/>
    <circle cx="80" cy="80" r="38" stroke="#6EA8FF" stroke-opacity=".75"/>
    <circle cx="80" cy="80" r="8" fill="#6EA8FF" filter="url(#nodeGlow)"/>
    <path d="M80 10V0M80 160V170M10 80H0M160 80H170" stroke="#4B86FF" stroke-opacity=".7"/>
    <text x="31" y="196" fill="#7EAAFF" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2.5">IMPACT</text>
    <text x="-2" y="219" fill="#5476A9" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.6">VALUE / GROWTH / RESULT</text>
  </g>

  <!-- arrows into impact -->
  <path d="M1020 390H1038" stroke="#6EA8FF" stroke-width="2"/>
  <path d="M1038 390L1028 384V396L1038 390Z" fill="#6EA8FF"/>

  <!-- technical labels -->
  <g fill="#5D83BC" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="1.8">
    <text x="170" y="536">INPUT: IDEA</text>
    <text x="470" y="560">PROCESSING LAYER</text>
    <text x="812" y="536">EXECUTION LAYER</text>
    <text x="994" y="536">OUTPUT: IMPACT</text>
  </g>

  <!-- bottom measurement line -->
  <g stroke="#3D7BFF" stroke-opacity=".7">
    <path d="M150 620H1050"/>
    <path d="M150 612V628M360 612V628M730 612V628M1020 612V628M1050 612V628"/>
  </g>
  <g fill="#5476A9" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="1.8">
    <text x="145" y="648">00</text>
    <text x="352" y="648">01</text>
    <text x="722" y="648">02</text>
    <text x="1012" y="648">03</text>
  </g>
</svg>